# BotFlow dashboard — static SPA + API reverse proxy.
#
# Install on the *frontend* host:
#   sudo cp web/deploy/wa-dashboard.nginx.conf /etc/nginx/sites-available/wa-dashboard
#   sudo ln -sf /etc/nginx/sites-available/wa-dashboard /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl enable --now nginx
#
# Upstream: use the API's public HTTPS URL if raw :8000 is blocked between instances.
# Edit host/server_name below to match your actual domain.
#
# Build with VITE_API_BASE_URL=/api/botflow so the browser calls same-origin /api/botflow/...

upstream botflow_fastapi {
    server botflow-api.onrender.com:443;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/wa-dashboard;
    index index.html;
    server_name botflow.ai;

    # Do not serve env / keys if they ever land under root (try_files would expose them).
    location ~* \.(env|pem|key)$ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (matches Vite dev: strip /api/botflow prefix)
    location = /api/botflow {
        return 301 /api/botflow/;
    }

    location /api/botflow/ {
        proxy_pass https://botflow_fastapi/;
        proxy_ssl_server_name on;
        proxy_ssl_name botflow-api.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header Host botflow-api.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
