# Mindorax dashboard — static SPA + API reverse proxy.
#
# Install on the *frontend* host (e.g. 52.65.65.205):
#   sudo cp web/deploy/wa-dashboard.nginx.conf /etc/nginx/sites-available/wa-dashboard
#   sudo ln -sf /etc/nginx/sites-available/wa-dashboard /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl enable --now nginx
#
# Upstream: use the API's public HTTPS URL if raw :8000 is blocked between instances
# (typical when FastAPI is only behind Caddy on 443). Edit host if your nip.io / domain differs.
#
# Build with VITE_API_BASE_URL=/api/mindorax so the browser calls same-origin /api/mindorax/...

upstream mindorax_fastapi {
    server api.mindoraxai.com:443;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/wa-dashboard;
    index index.html;
    server_name chat.mindoraxai.com;

    # Do not serve env / keys if they ever land under root (try_files would expose them).
    location ~* \.(env|pem|key)$ {
        deny all;
        return 404;
    }
    location ~ /\. {
        deny all;
        return 404;
    }

    # SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy (matches Vite dev: strip /api/mindorax prefix)
    location = /api/mindorax {
        return 301 /api/mindorax/;
    }

    location /api/mindorax/ {
        proxy_pass https://mindorax_fastapi/;
        proxy_ssl_server_name on;
        proxy_ssl_name api.mindoraxai.com;
        proxy_http_version 1.1;
        proxy_set_header Host api.mindoraxai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
